<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Lovely Panda · 点读绘本 V2</title>
<style>
body{margin:0;background:#fff8e9;font-family:Arial,"Microsoft YaHei",sans-serif;color:#25352b}.hero{padding:25px 15px;text-align:center;background:linear-gradient(135deg,#dff4df,#fff1bd)}h1{margin:5px;font-size:42px}.panda{font-size:64px}.tools{position:sticky;top:0;z-index:5;background:#fff;padding:10px;text-align:center;box-shadow:0 2px 10px #0002}.tools button,.tools select{padding:9px 12px;margin:3px;border:0;border-radius:14px;font-size:15px}.tools button{background:#4e9263;color:#fff}.tools select{border:1px solid #cdddcf;background:white}.page{max-width:850px;margin:20px auto;padding:0 15px}.card{background:white;border-radius:25px;padding:20px;margin:15px 0;box-shadow:0 5px 18px #00000012;border:2px solid #edf2e7}.tag{font-size:13px;color:#6b8571}.sentence{font-size:29px;font-weight:bold;line-height:1.5;cursor:pointer;padding:9px;border-radius:14px}.sentence:hover,.active{background:#dff3e3}.cn{font-size:18px;color:#777;padding:4px 9px}.words{padding:10px 7px;display:flex;gap:7px;flex-wrap:wrap}.word{padding:7px 10px;background:#edf7ee;border-radius:20px;cursor:pointer;border:1px solid #d3e9d5}.word:hover{background:#cfead2}.mode{margin:15px auto;max-width:850px;background:#fff0bd;border-radius:18px;padding:12px;text-align:center}.challenge{margin:25px auto;max-width:850px;background:#ffe8ef;padding:20px;border-radius:25px;text-align:center}.hiddenText{filter:blur(7px);user-select:none}.footer{text-align:center;padding:25px;color:#777}
@media(max-width:600px){h1{font-size:32px}.sentence{font-size:24px}}
</style><body>
<div class="hero"><div class="panda">🐼🎋🐼</div><h1>My Lovely Panda</h1><div>我的可爱熊猫 · 英语真人感点读练习 V2</div></div>
<div class="tools">
<button onclick="playAll()">▶ 全文</button><button onclick="stop()">■ 停止</button>
<button onclick="rate=.7">🐢 慢速</button><button onclick="rate=.9">🗣 正常</button>
<select id="voice"></select>
</div>
<div class="mode">🌟 <b>练习方法：</b>先点句子听 → 再点单词 → 最后自己朗读。每次只练 3～5 句！</div>
<div class="page" id="book"></div>
<div class="challenge"><h2>🐼 听力挑战</h2><p id="q">点击开始，先听一句，不看答案，自己说出来！</p><button onclick="quiz()">🎧 开始挑战</button> <button onclick="answer()">👀 显示答案</button></div>
<div class="footer">🐼 Little by little, you will be great!</div>
<script>
const lines=[
["Hello, everyone!","大家好！"],["My name is Huahua.","我的名字叫花花。"],["I am seven years old.","我七岁了。"],["Today, I want to tell you about my lovely friend.","今天，我想给大家介绍我的一位可爱的朋友。"],["Who is my friend?","我的朋友是谁呢？"],["Look!","看！"],["It is black and white.","它是黑白相间的。"],["It has a round face.","它有一张圆圆的脸。"],["It has two black ears.","它有两只黑色的耳朵。"],["It has two big black eyes.","它有一双大大的黑眼睛。"],["It is very cute!","它非常可爱！"],["Can you guess?","你能猜出来吗？"],["Yes!","对啦！"],["It is a panda!","它就是大熊猫！"],["Pandas live in China.","大熊猫生活在中国。"],["Pandas are very special in China.","大熊猫在中国非常特别。"],["I love pandas very much.","我非常喜欢大熊猫。"],["What do pandas like to eat?","大熊猫喜欢吃什么呢？"],["They like bamboo!","它们喜欢吃竹子！"],["They eat bamboo in the morning.","早上，它们吃竹子。"],["They eat bamboo in the afternoon.","下午，它们吃竹子。"],["They eat bamboo at night.","晚上，它们还是吃竹子。"],["Eat, eat, eat!","吃呀，吃呀，吃！"],["After eating, what do they do?","吃完以后，它们做什么呢？"],["They sleep!","它们睡觉！"],["Eat and sleep.","吃了睡。"],["Eat and sleep.","睡了吃。"],["What a happy life!","多么快乐的生活呀！"],["Pandas are cute.","大熊猫很可爱。"],["Pandas are funny.","大熊猫很有趣。"],["Pandas are lovely.","大熊猫很招人喜欢。"],["Many people love pandas.","很多人都喜欢大熊猫。"],["People from many countries love pandas, too.","很多国家的人们也喜欢大熊猫。"],["When people see pandas, they think of China.","当人们看到大熊猫，就会想到中国。"],["China is the home of pandas.","中国是大熊猫的家。"],["China is my home, too.","中国也是我的家。"],["I love my lovely panda.","我爱我可爱的大熊猫。"],["I love my beautiful China.","我爱美丽的中国。"],["I hope more people can know pandas.","我希望有更多的人认识大熊猫。"],["I hope more people can know China.","我也希望有更多的人了解中国。"],["Pandas come from China.","大熊猫来自中国。"],["They say:","它们好像在说："],["Hello, world!","世界，你们好！"],["And I want to say:","而我也想说："],["Hello, world!","世界，你们好！"],["This is my lovely panda.","这是我可爱的大熊猫。"],["This is my beautiful China!","这是我美丽的中国！"],["Thank you, everyone!","谢谢大家！"]];
let rate=.82,vs=[],qi=0;
const book=document.querySelector('#book');
lines.forEach((x,i)=>{let c=document.createElement('div');c.className='card';let words=x[0].match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[];c.innerHTML=`<div class=tag>第 ${i+1} 句 · 点击整句朗读</div><div class=sentence>${x[0]} 🔊</div><div class=cn>${x[1]}</div><div class=words>${words.map(w=>`<span class=word>${w}</span>`).join('')}</div>`;c.querySelector('.sentence').onclick=()=>say(x[0],c);c.querySelectorAll('.word').forEach((w,j)=>w.onclick=e=>{e.stopPropagation();say(words[j],c)});book.append(c)});
function voices(){vs=speechSynthesis.getVoices().filter(v=>/^en-(US|GB|AU)/i.test(v.lang));let s=document.querySelector('#voice');s.innerHTML='';vs.sort((a,b)=>/natural|online|enhanced|premium/i.test(b.name)-/natural|online|enhanced|premium/i.test(a.name));vs.forEach((v,i)=>s.add(new Option('🎙 '+v.name+' · '+v.lang,i)));}voices();speechSynthesis.onvoiceschanged=voices;
function say(t,el){stop();let u=new SpeechSynthesisUtterance(t),v=vs[document.querySelector('#voice').value]||vs[0];if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=rate;u.pitch=1;if(el)el.classList.add('active');u.onend=()=>el&&el.classList.remove('active');speechSynthesis.speak(u)}
function stop(){speechSynthesis.cancel();document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'))}
async function playAll(){stop();for(let i=0;i<lines.length;i++){let el=document.querySelectorAll('.card')[i];el.classList.add('active');await new Promise(r=>{let u=new SpeechSynthesisUtterance(lines[i][0]),v=vs[document.querySelector('#voice').value]||vs[0];if(v)u.voice=v;u.lang=v?v.lang:'en-US';u.rate=rate;u.onend=r;u.onerror=r;speechSynthesis.speak(u)});el.classList.remove('active')}}
function quiz(){qi=Math.floor(Math.random()*lines.length);document.querySelector('#q').textContent='🙉 认真听！然后自己说一遍。';say(lines[qi][0])}
function answer(){document.querySelector('#q').innerHTML='<b>'+lines[qi][0]+'</b><br>'+lines[qi][1]}
</script></body></html>
